<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <title>KE Volume Mixer</title>
  <desc>Three separate app tiles, each with its own volume control.</desc>
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="0.85" y2="1">
      <stop stop-color="#262d31"/><stop offset="0.52" stop-color="#181e21"/><stop offset="1" stop-color="#101416"/>
    </linearGradient>
    <linearGradient id="mint" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#c6eddd"/><stop offset="1" stop-color="#91d2b9"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#71857f" stop-opacity=".55"/><stop offset=".45" stop-color="#4a5b55" stop-opacity=".15"/><stop offset="1" stop-color="#050707" stop-opacity=".5"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
    <filter id="glyphShadow" x="-10%" y="-15%" width="120%" height="140%" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="5"/>
    </filter>
    <g id="tiles">
      <rect x="224" y="282" width="124" height="124" rx="32"/>
      <rect x="224" y="450" width="124" height="124" rx="32"/>
      <rect x="224" y="618" width="124" height="124" rx="32"/>
    </g>
    <g id="caps">
      <rect x="684" y="296" width="64" height="96" rx="24"/>
      <rect x="476" y="464" width="64" height="96" rx="24"/>
      <rect x="604" y="632" width="64" height="96" rx="24"/>
    </g>
  </defs>
  <rect x="108" y="123" width="808" height="808" rx="178" fill="#030807" opacity=".36" filter="url(#shadow)"/>
  <rect x="100" y="100" width="824" height="824" rx="184" fill="url(#body)"/>
  <rect x="101.5" y="101.5" width="821" height="821" rx="182.5" fill="none" stroke="url(#rim)" stroke-width="3"/>
  <g fill="#000" opacity=".24" transform="translate(0 8)" filter="url(#glyphShadow)"><use href="#tiles"/><use href="#caps"/></g>
  <g fill="#45554e">
    <rect x="372" y="332" width="428" height="24" rx="12"/>
    <rect x="372" y="500" width="428" height="24" rx="12"/>
    <rect x="372" y="668" width="428" height="24" rx="12"/>
  </g>
  <g fill="#a8e0cd">
    <rect x="372" y="332" width="344" height="24" rx="12"/>
    <rect x="372" y="500" width="136" height="24" rx="12"/>
    <rect x="372" y="668" width="264" height="24" rx="12"/>
  </g>
  <g fill="url(#mint)"><use href="#tiles"/><use href="#caps"/></g>
</svg>
